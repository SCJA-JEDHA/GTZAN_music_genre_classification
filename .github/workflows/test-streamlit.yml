name: Tests Streamlit

on:
  push:
    branches: [main, dev]
    paths:
      - 'streamlit/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'streamlit/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_APP_PATH: streamlit/streamlit_music_app4.py
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          # si l'app a son propre requirements.txt (déps de prod à jour), l'installer aussi :
          if [ -f streamlit/requirements.txt ]; then pip install -r streamlit/requirements.txt; fi

      - name: Lancer les tests
        run: pytest tests/ -v
